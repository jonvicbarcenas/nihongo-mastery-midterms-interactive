name: Check and build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Build production container
        run: docker build -t nihongo-mastery:check .
      - name: Check container with restricted capabilities
        run: bash scripts/check-container.sh nihongo-mastery:check
